name: Metrics

# Runs after each feature lands on the default branch, so the trend has one
# datapoint per merged change rather than one per week. No schedule.
on:
  push:
    branches: [__DEFAULT_BRANCH__]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metrics:
    name: metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "__JAVA_VERSION__"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build and measure
        run: |
          ./gradlew assembleRelease -x lint || ./gradlew assembleDebug
          {
            echo "# Metrics for ${GITHUB_SHA::8}"
            echo
            echo "## Artifact size"
            find __MODULE__/build/outputs -name '*.apk' -o -name '*.aab' \
              | while read -r f; do
                  printf '%s  %s\n' "$(du -h "$f" | cut -f1)" "$(basename "$f")"
                done
            echo
            echo "## Source size"
            echo "Kotlin files: $(find __MODULE__/src -name '*.kt' | wc -l)"
            echo "Kotlin lines: $(find __MODULE__/src -name '*.kt' -exec cat {} + | wc -l)"
          } > metrics.md

      - name: Static analysis counts
        continue-on-error: true
        run: |
          ./gradlew detekt lintDebug || true
          {
            echo
            echo "## detekt findings"
            grep -c '<error' __MODULE__/build/reports/detekt/detekt.xml 2>/dev/null || echo "n/a"
            echo
            echo "## lint warnings"
            grep -c '<issue' __MODULE__/build/reports/lint-results-debug.xml 2>/dev/null || echo "n/a"
          } >> metrics.md

      - name: Summary
        if: always()
        run: cat metrics.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metrics
          path: metrics.md
